AWSTemplateFormatVersion: 2010-09-09
Description: Creating and EC2 Instance using CloudFormation
Resources:
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      # AvailabilityZone: us-east-1a
      ImageId: ami-0b6d9d3d33ba97d99
      InstanceType: t3.micro
      KeyName: awsKey2
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          SubnetId: !Ref mysubnet
          GroupSet:
            - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: Instance-1

  # Create a VPC
  myVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 11.0.0.0/16
      InstanceTenancy: default
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: vpc-cft

  # Security Group with ingress rules 22 and 80
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ec2-sg
      GroupDescription: This is for port 22 and 80
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      VpcId: !Ref myVPC
      Tags:
        - Key: Name
          Value: ec2-sg

  # Create Internet Gateway
  MyIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: my-igw

  # Attach Internet Gateway to VPC
  myInternetGatewayVPCattachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref myVPC
      InternetGatewayId: !Ref MyIGW

  # Create a Subnet
  mysubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: us-east-1a
      VpcId: !Ref myVPC
      CidrBlock: 11.0.1.0/24
      Tags:
        - Key: Name
          Value: my-subnet

  # Create Route Table
  Myrt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref myVPC
      Tags:
        - Key: Name
          Value: my-rt

  # Associate Route table with subnet
  subnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref mysubnet
      RouteTableId: !Ref Myrt

  # Associate IGW to Route Table
  InternetGatewayAssociation:
    Type: AWS::EC2::Route
    DependsOn: myInternetGatewayVPCattachment # Waits until IGW attached to the VPC
    Properties:
      GatewayId: !Ref MyIGW
      RouteTableId: !Ref Myrt
      DestinationCidrBlock: 0.0.0.0/0
