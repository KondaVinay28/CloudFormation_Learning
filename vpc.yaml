AWSTemplateFormatVersion: 2010-09-09
Description: Creating VPC using CFT
Parameters:
  vpcName:
    Description: Enter the vpc Name
    Type: String
Resources:
  VpcUsingCFT:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 12.0.0.0/16
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Ref vpcName
Outputs:
  vpcId:
    Description: The VPC ID
    Value: !Ref VpcUsingCFT
